name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # run-hook has no .sh extension, so list the scripts explicitly.
      - name: shellcheck
        run: shellcheck skills/agents-setup/scripts/*.sh skills/agents-setup/scripts/run-hook
